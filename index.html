<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardCompare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <header class="bg-dark text-white p-3">
        <div class="container-fluid">
            <div class="row align-items-center">

                <div class="col-12 c col-md-6">
                    <h1>HardCompare</h1>
                </div>

                <div class="col-12 col-sm-12 col-md-6 text-md-end">
                    <a href="#" class="text-white me-3">Home</a>
                    <a href="#" class="text-white me-3">Peças</a>
                    <a href="#" class="text-white me-3">Comparar</a>
                    <a href="#" class="text-white me-3">Contato</a>

                    <input type="text" class="col-sm-3" placeholder="Pesquisar">
                    <button>Buscar</button>
                </div>

            </div>
        </div>
    </header>

    <main>

        <section class="text-center p-5 bg-secondary text-white">
            <h2>Monte seu PC Ideal</h2>
            <p>Compare peças e escolha o melhor desempenho!</p>
            <button class="btn btn-light">Comparar Peças</button>
        </section>

        <div class="container mt-4">
            <div class="row">

                <div class="col-md-4">
                    <h2 class="text-center">Categorias</h2>

                    <div class="row">
                        <div class="col-6 col-md-12 mb-2">
                            <div class="card p-3 text-center">CPU</div>
                        </div>
                        <div class="col-6 col-md-12 mb-2">
                            <div class="card p-3 text-center">GPU</div>
                        </div>
                        <div class="col-6 col-md-12 mb-2">
                            <div class="card p-3 text-center">RAM</div>
                        </div>
                        <div class="col-6 col-md-12 mb-2">
                            <div class="card p-3 text-center">SSD</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <h2 class="text-center">Lista de Peças</h2>

                    <div class="row" id="lista-pecas">

                    </div>
                </div>

            </div>
        </div>

        <section class="text-center mt-4">
            <h2>Destaques</h2>
            <p>Melhor custo benefício RX 7600</p>
        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3 mt-4">
        <a href="#" class="text-white me-3">Contato</a>
        <a href="#" class="text-white me-3">Sobre</a>
        <a href="#" class="text-white me-3">Redes Sociais</a>
        <a href="#" class="text-white">GitHub</a>
    </footer>


<script src="app.js"></script>
</body>

</html>
